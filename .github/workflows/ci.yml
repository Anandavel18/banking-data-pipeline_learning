name: Simple CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt-ci:
    name: dbt tests
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/452020239246/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "banking-migration-test@project-b23f2a51-1258-4419-9bd.iam.gserviceaccount.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Install dbt dependencies
        working-directory: Techincal_Exercise/banking_migration_dbt
        run: dbt deps

      - name: Compile dbt project
        working-directory: Techincal_Exercise/banking_migration_dbt
        run: dbt compile

      - name: Run dbt tests
        working-directory: Techincal_Exercise/banking_migration_dbt
        run: dbt test

      - name: Run all scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          chmod +x Techincal_Exercise/script/*.sh
          dos2unix Techincal_Exercise/script/*.sh
          Techincal_Exercise/script/arch_table_creation_script.sh
          Techincal_Exercise/script/source_file_creation_1.sh
          Techincal_Exercise/script/source_file_upload_to_gcs_script.sh
          Techincal_Exercise/script/source_files_load_to_arch_table_script.sh
          Techincal_Exercise/script/dbt_all.sh

  terraform-ci:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform format check
        working-directory: Techincal_Exercise/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: Techincal_Exercise/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: Techincal_Exercise/terraform
        run: terraform validate
