version: 2

models:
  - name: stg_transactions
    columns:

      - name: transaction_id
        tests:
          - not_null
          - unique

      - name: customer_key
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

      - name: transaction_type
        tests:
          - accepted_values:
              values: ['DEBIT', 'CREDIT']

      - name: status
        tests:
          - accepted_values:
              values: ['SUCCESS', 'FAILED']