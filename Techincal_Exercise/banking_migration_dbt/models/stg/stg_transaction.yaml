version: 2

models:
  - name: stg_transactions
    columns:

      - name: transaction_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

      - name: transaction_type
        tests:
          - accepted_values:
              values: ['TRANSFER', 'PURCHASE','WITHDRAWAL','PAYMENT']

      - name: status
        tests:
          - accepted_values:
              values: ['SUCCESS','PENDING','FAILED']